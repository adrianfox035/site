<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LinkHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         TOPO
    ========================== -->

    <header class="topbar">

        <div class="topbar-left">
            <div id="siteLogo" class="site-logo">🔗</div>
        </div>

        <div class="topbar-center">
            <h1 id="siteTitle">LinkHub</h1>
        </div>

        <div class="topbar-right">

            <button id="adminButton" class="admin-button">
                Admin
            </button>

            <button id="logoutButton" class="admin-button hidden">
                Sair
            </button>

        </div>

    </header>


    <!-- =========================
         CONTEÚDO
    ========================== -->

    <main>

        <!-- =========================
             HOME
        ========================== -->

        <section id="homePage" class="page">

            <div class="page-heading">

                <div>
                    <h2>Pastas</h2>

                    <p>
                        Escolha uma pasta para acessar seus links.
                    </p>
                </div>

                <div class="page-controls">

                    <button
                        id="organizeButton"
                        class="control-button"
                        type="button"
                    >
                        ⚙️ Organizar
                    </button>

                    <button
                        id="themeButton"
                        class="control-button admin-only hidden"
                        type="button"
                    >
                        🎨 Cor
                    </button>

                </div>

            </div>


            <!-- =========================
                 ORGANIZAÇÃO DAS PASTAS
            ========================== -->

            <div
                id="organizePanel"
                class="organize-panel hidden"
            >

                <div class="organize-section">

                    <strong>Ordenar:</strong>

                    <button
                        class="sort-option active"
                        data-sort="newest"
                        type="button"
                    >
                        Mais recentes
                    </button>

                    <button
                        class="sort-option"
                        data-sort="oldest"
                        type="button"
                    >
                        Mais antigas
                    </button>

                    <button
                        class="sort-option"
                        data-sort="most-links"
                        type="button"
                    >
                        Mais links
                    </button>

                    <button
                        class="sort-option"
                        data-sort="least-links"
                        type="button"
                    >
                        Menos links
                    </button>

                    <button
                        class="sort-option"
                        data-sort="color"
                        type="button"
                    >
                        Por cor
                    </button>

                </div>


                <div class="organize-section">

                    <strong>Layout:</strong>

                    <label>

                        Pastas por linha:

                        <select id="itemsPerRow">

                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4" selected>4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="8">8</option>
                            <option value="10">10</option>
                            <option value="12">12</option>

                        </select>

                    </label>

                    <button
                        id="layoutToggle"
                        class="layout-button"
                        type="button"
                    >
                        ⬜ Grade
                    </button>

                </div>

            </div>


            <!-- =========================
                 PASTAS
            ========================== -->

            <div id="foldersGrid" class="cards-grid"></div>


            <button
                id="addFolderButton"
                class="add-button"
                type="button"
            >
                + Adicionar pasta
            </button>

        </section>


        <!-- =========================
             PÁGINA DA PASTA
        ========================== -->

        <section id="folderPage" class="page hidden">

            <div class="page-heading">

                <div class="folder-heading">

                    <button
                        id="backButton"
                        class="back-button"
                        type="button"
                    >
                        ←
                    </button>

                    <div>

                        <h2 id="folderTitle">
                            Pasta
                        </h2>

                        <p>
                            Links desta pasta.
                        </p>

                    </div>

                </div>


                <div class="page-controls">

                    <button
                        id="organizeLinksButton"
                        class="control-button"
                        type="button"
                    >
                        ⚙️ Organizar
                    </button>

                    <button
                        id="themeButtonLinks"
                        class="control-button admin-only hidden"
                        type="button"
                    >
                        🎨 Cor
                    </button>

                </div>

            </div>


            <!-- ORGANIZAÇÃO DOS LINKS -->

            <div
                id="organizeLinksPanel"
                class="organize-panel hidden"
            >

                <div class="organize-section">

                    <strong>Ordenar:</strong>

                    <button
                        class="link-sort-option active"
                        data-sort="newest"
                        type="button"
                    >
                        Mais recentes
                    </button>

                    <button
                        class="link-sort-option"
                        data-sort="oldest"
                        type="button"
                    >
                        Mais antigos
                    </button>

                    <button
                        class="link-sort-option"
                        data-sort="color"
                        type="button"
                    >
                        Por cor
                    </button>

                </div>


                <div class="organize-section">

                    <strong>Layout:</strong>

                    <label>

                        Links por linha:

                        <select id="linksPerRow">

                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4" selected>4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="8">8</option>
                            <option value="10">10</option>
                            <option value="12">12</option>

                        </select>

                    </label>

                    <button
                        id="linkLayoutToggle"
                        class="layout-button"
                        type="button"
                    >
                        ⬜ Grade
                    </button>

                </div>

            </div>


            <div id="linksGrid" class="cards-grid"></div>


            <button
                id="addLinkButton"
                class="add-button"
                type="button"
            >
                + Adicionar link
            </button>

        </section>

    </main>


    <!-- =========================
         MODAL ADMIN
    ========================== -->

    <div
        id="adminModal"
        class="modal-overlay hidden"
    >

        <div class="modal">

            <button
                class="modal-close"
                data-close="adminModal"
                type="button"
            >
                ×
            </button>

            <h2>🔐 Administrador</h2>

            <p>
                Digite a senha administrativa.
            </p>

            <input
                id="adminPassword"
                type="password"
                placeholder="Senha"
                autocomplete="off"
            >

            <div id="adminError" class="modal-error"></div>

            <button
                id="confirmAdminButton"
                class="primary-button"
                type="button"
            >
                Entrar
            </button>

        </div>

    </div>


    <!-- =========================
         MODAL PASTA
    ========================== -->

    <div
        id="folderModal"
        class="modal-overlay hidden"
    >

        <div class="modal">

            <button
                class="modal-close"
                data-close="folderModal"
                type="button"
            >
                ×
            </button>

            <h2 id="folderModalTitle">
                📁 Nova pasta
            </h2>

            <label>

                Nome

                <input
                    id="folderName"
                    type="text"
                    maxlength="60"
                    placeholder="Nome da pasta"
                >

            </label>


            <label>

                Cor

                <div class="color-input">

                    <input
                        id="folderColor"
                        type="color"
                        value="#4f7cff"
                    >

                    <span id="folderColorValue">
                        #4f7cff
                    </span>

                </div>

            </label>


            <button
                id="saveFolderButton"
                class="primary-button"
                type="button"
            >
                Salvar
            </button>

        </div>

    </div>


    <!-- =========================
         MODAL LINK
    ========================== -->

    <div
        id="linkModal"
        class="modal-overlay hidden"
    >

        <div class="modal">

            <button
                class="modal-close"
                data-close="linkModal"
                type="button"
            >
                ×
            </button>

            <h2 id="linkModalTitle">
                🔗 Novo link
            </h2>

            <label>

                Nome

                <input
                    id="linkName"
                    type="text"
                    maxlength="80"
                    placeholder="Nome do link"
                >

            </label>


            <label>

                Link

                <input
                    id="linkUrl"
                    type="url"
                    placeholder="https://exemplo.com"
                >

            </label>


            <label>

                Cor

                <div class="color-input">

                    <input
                        id="linkColor"
                        type="color"
                        value="#00a884"
                    >

                    <span id="linkColorValue">
                        #00a884
                    </span>

                </div>

            </label>


            <button
                id="saveLinkButton"
                class="primary-button"
                type="button"
            >
                Salvar
            </button>

        </div>

    </div>


    <!-- =========================
         MODAL TEMA
    ========================== -->

    <div
        id="themeModal"
        class="modal-overlay hidden"
    >

        <div class="modal theme-modal">

            <button
                class="modal-close"
                data-close="themeModal"
                type="button"
            >
                ×
            </button>

            <h2>🎨 Personalizar página</h2>

            <p>
                Essas cores serão aplicadas para todos os visitantes.
            </p>


            <label>
                Fundo
                <input id="themeBackground" type="color">
            </label>


            <label>
                Topo
                <input id="themeTopbar" type="color">
            </label>


            <label>
                Texto
                <input id="themeText" type="color">
            </label>


            <label>
                Títulos
                <input id="themeHeading" type="color">
            </label>


            <label>
                Bordas
                <input id="themeBorder" type="color">
            </label>


            <label>
                Botões
                <input id="themeButtonColor" type="color">
            </label>


            <label>
                Logo
                <input id="themeLogo" type="color">
            </label>


            <div class="theme-actions">

                <button
                    id="resetThemeButton"
                    class="secondary-button"
                    type="button"
                >
                    Restaurar
                </button>

                <button
                    id="saveThemeButton"
                    class="primary-button"
                    type="button"
                >
                    Salvar tema
                </button>

            </div>

        </div>

    </div>


    <!-- TOAST -->

    <div id="toast" class="toast"></div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="script.js"></script>

</body>

</html>
